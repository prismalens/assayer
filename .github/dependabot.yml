version: 2
updates:
  - package-ecosystem: npm
    directory: "/runner"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Group low-risk minor and patch bumps to review in bulk; majors open
      # individually for separate review.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Group only minor and patch updates; majors open individually.
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
