# release-please keeps one release PR open; merging it tags a version and this workflow
# publishes @prismalens/assayer through npm trusted publishing, with provenance.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs['runner--release_created'] }}
      tag: ${{ steps.rp.outputs['runner--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # A PAT: Actions may not open pull requests here, and a PR opened with GITHUB_TOKEN
          # starts no checks, so the ruleset's required checks would never report.
          token: ${{ secrets.RELEASE_PAT || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test
        working-directory: runner
        run: npm ci && npm test

      - name: Publish
        working-directory: runner
        run: npm publish --provenance --access public

      - name: Version
        id: version
        working-directory: runner
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The registry lists a version before its tarball serves (prismalens/gh-workflows#250).
      - uses: prismalens/gh-workflows/actions/wait-npm-tarball@6e7fad0d8fde93657d2d79b9e3e9dd16d2afa784  # main 2026-10-24
        with:
          package: '@prismalens/assayer'
          version: ${{ steps.version.outputs.version }}

      - uses: prismalens/gh-workflows/actions/npm-install-retry@6e7fad0d8fde93657d2d79b9e3e9dd16d2afa784  # main 2026-10-24
        with:
          command: npm i -g "@prismalens/assayer@${{ steps.version.outputs.version }}"

      - name: The published version starts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          got="$(assayer --version)"
          [ "$got" = "$VERSION" ] || { echo "::error::npm's @prismalens/assayer@$VERSION printed '$got'"; exit 1; }
