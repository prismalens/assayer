# RELEASING.md's clean-machine walk in CI (#7): the tarball packed on Linux, installed on fresh
# runners, and every row run with Claude Code against scripted aimock fixtures, so no model is
# paid for (prismalens/prismalens#914). The shared parts come from prismalens/gh-workflows#250.
name: Release walk

on:
  pull_request:
    paths:
      - runner/**
      - .github/release-walk/**
      - .github/workflows/release-walk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - uses: prismalens/gh-workflows/actions/pack-linux@6e7fad0d8fde93657d2d79b9e3e9dd16d2afa784  # main 2026-10-24
        with:
          working-directory: runner
          artifact-name: assayer-tarball

  walk:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: assayer-tarball
          path: ${{ runner.temp }}/pack

      - uses: prismalens/gh-workflows/actions/npm-install-retry@6e7fad0d8fde93657d2d79b9e3e9dd16d2afa784  # main 2026-10-24
        with:
          command: npm i -g "$RUNNER_TEMP"/pack/*.tgz

      - name: Rows before an engine
        run: bash .github/release-walk/rows.sh before

      - uses: prismalens/gh-workflows/actions/setup-acp-engine@6e7fad0d8fde93657d2d79b9e3e9dd16d2afa784  # main 2026-10-24
        with:
          engine: claude-code
          version: 2.1.310
          adapter-version: 0.89.1
          mock-fixtures: .github/release-walk/aimock.json

      - name: Rows with the engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release-walk/rows.sh engine

      - name: Record the rows
        if: always()
        env:
          OS: ${{ matrix.os }}
        run: |
          { echo "### Release walk on $OS"; echo; cat "$RUNNER_TEMP/rows.md" 2>/dev/null || echo "no rows recorded"; } >> "$GITHUB_STEP_SUMMARY"
