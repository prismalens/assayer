name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install
        run: npm ci

      # Unit tests only: the contract, the policy and the mapper. The engine itself is
      # covered by runner/scripts/permission-probe.sh, which needs a model. Story: gh-workflows#184.
      - name: Runner tests
        run: npm test
