<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Assayer</title>
  <desc id="d">Assayer reviews a pull request on your machine and posts each finding inline under your own login. Shown: a real finding it posted on a demo pull request.</desc>
  <rect width="1280" height="440" fill="#10131f"/>
  <g stroke="#1a1f31" stroke-width="1"><line x1="40" y1="0" x2="40" y2="440"/><line x1="80" y1="0" x2="80" y2="440"/><line x1="120" y1="0" x2="120" y2="440"/><line x1="160" y1="0" x2="160" y2="440"/><line x1="200" y1="0" x2="200" y2="440"/><line x1="240" y1="0" x2="240" y2="440"/><line x1="280" y1="0" x2="280" y2="440"/><line x1="320" y1="0" x2="320" y2="440"/><line x1="360" y1="0" x2="360" y2="440"/><line x1="400" y1="0" x2="400" y2="440"/><line x1="440" y1="0" x2="440" y2="440"/><line x1="480" y1="0" x2="480" y2="440"/><line x1="520" y1="0" x2="520" y2="440"/><line x1="560" y1="0" x2="560" y2="440"/><line x1="600" y1="0" x2="600" y2="440"/><line x1="640" y1="0" x2="640" y2="440"/><line x1="680" y1="0" x2="680" y2="440"/><line x1="720" y1="0" x2="720" y2="440"/><line x1="760" y1="0" x2="760" y2="440"/><line x1="800" y1="0" x2="800" y2="440"/><line x1="840" y1="0" x2="840" y2="440"/><line x1="880" y1="0" x2="880" y2="440"/><line x1="920" y1="0" x2="920" y2="440"/><line x1="960" y1="0" x2="960" y2="440"/><line x1="1000" y1="0" x2="1000" y2="440"/><line x1="1040" y1="0" x2="1040" y2="440"/><line x1="1080" y1="0" x2="1080" y2="440"/><line x1="1120" y1="0" x2="1120" y2="440"/><line x1="1160" y1="0" x2="1160" y2="440"/><line x1="1200" y1="0" x2="1200" y2="440"/><line x1="1240" y1="0" x2="1240" y2="440"/></g>
  <rect width="1280" height="440" fill="#10131f" opacity="0.55"/>
  <path d="M74 306 C 140 296, 210 304, 300 292" stroke="#d9a441" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <text x="72" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="84" font-weight="700" fill="#e9e6dc" letter-spacing="-2">assayer</text>
  <text x="76" y="236" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#e9e6dc">Code review that runs on your machine</text>
  <text x="76" y="268" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#e9e6dc">and posts as you.</text>
  <text x="76" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#9aa0b8">$ assayer review owner/repo#13 --post</text>
  <text x="76" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#9aa0b8">Codex · Claude Code · OpenCode — your own sign-in</text>
  <g transform="translate(640 36)">
    <rect width="600" height="368" rx="10" fill="#171b2b" stroke="#2a3047"/>
    <text x="20" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9aa0b8">src/todos/todos.service.ts</text>
    <line x1="0" y1="46" x2="600" y2="46" stroke="#2a3047"/>
    <rect x="0" y="52" width="600" height="26" fill="#1d3a2a"/>
    <text x="14" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#7fd6a0">210 +   const cacheKey = `todos:user:page:${page}:${limit}`;</text>
    <rect x="18" y="92" width="564" height="262" rx="8" fill="#2b1c22" stroke="#f07178" stroke-opacity="0.55"/>
    <circle cx="40" cy="116" r="9" fill="#f07178"/>
    <text x="58" y="121" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e9e6dc">Sumit1993 · Security &amp; Privacy · Critical</text>
    <text x="36" y="154" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e9e6dc">Per-user cache key leaves out userId,</text>
    <text x="36" y="176" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e9e6dc">so users get each other's todos</text>
    <text x="36" y="206" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#e9e6dc">After GET /todos/user/1 fills the cache, GET /todos/user/2</text>
    <text x="36" y="226" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#e9e6dc">gets user 1's todos for the next 60 seconds.</text>
    <text x="36" y="258" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa0b8">Suggested change</text>
    <rect x="36" y="266" width="528" height="24" fill="#3d1e24"/>
    <text x="44" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#f08a96">- const cacheKey = `todos:user:page:${page}:${limit}`;</text>
    <rect x="36" y="290" width="528" height="24" fill="#1d3a2a"/>
    <text x="44" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7fd6a0">+ const cacheKey = `todos:user:${userId}:page:${page}:${limit}`;</text>
    <text x="36" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#9aa0b8">&lt;!-- assayer-finding engine=claude-code --&gt;</text>
  </g>
</svg>
